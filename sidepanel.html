<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Sidebar</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="src/sidepanel/writing-assistant.css">
</head>
<body class="gemini-theme">
  <nav id="primary-tabs" aria-label="主导航">
    <button type="button" data-primary-tab="writing" role="tab" aria-selected="false">写作助手</button>
    <button type="button" data-primary-tab="tools" role="tab" aria-selected="true">AI 工具</button>
  </nav>
  <main id="writing-assistant-panel" role="tabpanel" hidden></main>
  <div id="app-container">
    <!-- Top Context Bar -->
    <div id="context-bar-container">
      <div id="context-bar">
        <!-- Context buttons will be injected here -->
      </div>
      <button id="add-context-btn" title="新建聊天">+</button>
      <button id="language-btn" class="language-btn" title="选择语言">🌐</button>
    </div>

    <!-- Chat Area -->
    <div id="chat-container">
      <!-- Messages will be injected here -->
      <div class="welcome-message">请选择或新建一个聊天上下文开始。</div>
    </div>

    <!-- Bottom Input Area -->
    <div id="input-area-wrapper">
      <div id="input-controls">
        <select id="model-select">
          <option value="" disabled selected>选择模型...</option>
        </select>
        <button id="thinking-toggle-btn" class="toggle-btn default" title="DeepSeek 思考参数 (默认/关闭)">默认</button>
        <div id="more-menu-wrap" class="more-menu-wrap">
          <button id="more-btn" class="text-btn" type="button" aria-haspopup="menu" aria-expanded="false">更多</button>
          <div id="more-menu" class="more-menu hidden" role="menu" aria-label="更多操作">
            <button id="config-btn" class="more-menu-item" type="button" role="menuitem">API配置</button>
            <button id="stats-toggle-btn" class="more-menu-item on" type="button" role="menuitem" title="显示时间/速度指标">时间指标</button>
            <button id="align-toggle-btn" class="more-menu-item" type="button" role="menuitem" title="消息对齐方式">对齐</button>
            <button id="clear-btn" class="more-menu-item" type="button" role="menuitem" title="清空当前上下文消息">清空</button>
          </div>
        </div>
      </div>
      <div id="input-box-container">
        <div id="image-preview-container" class="hidden">
          <!-- Image previews will be shown here -->
        </div>
        <div class="input-row">
          <textarea id="chat-input" placeholder="输入消息... (Shift+Enter 换行)" rows="1"></textarea>
          <input type="file" id="image-input" accept="image/*" multiple style="display:none">
          <button id="image-btn" title="Send image">📷</button>
          <button id="mic-btn" title="语音输入">🎤</button>
          <button id="send-btn">➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- API Config Modal -->
  <div id="api-config-modal" class="modal hidden">
    <div class="modal-content wide-modal">
      <div class="modal-header">
        <h3>大模型 API 配置</h3>
        <button class="close-modal-btn">&times;</button>
      </div>
      <div class="modal-body api-config-layout">
        <div class="api-sidebar">
           <div class="sidebar-header">供应商列表</div>
           <div id="providers-list">
             <!-- List items -->
           </div>
           <button id="add-provider-btn" class="secondary-btn full-width">添加供应商</button>
        </div>
        <div class="api-details">
           <div id="provider-form">
               <!-- Form fields injected by JS -->
               <div class="empty-state">请选择左侧供应商进行编辑</div>
           </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="export-models-btn" class="secondary-btn">导出模型配置</button>
        <input type="file" id="import-models-file" style="display:none" accept=".json">
        <button id="import-models-btn" class="secondary-btn">导入模型配置</button>
        <button id="save-api-config-btn" class="primary-btn">保存当前修改</button>
      </div>
    </div>
  </div>

  <!-- Context Config Modal -->
  <div id="context-config-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>上下文配置</h3>
        <button class="close-modal-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="ctx-name">名称</label>
          <input type="text" id="ctx-name">
        </div>
        <div class="form-group">
          <label for="ctx-system-prompt">系统提示词</label>
          <textarea id="ctx-system-prompt" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="ctx-max-history">消息数量上限 (0为不限, 1为仅当前)</label>
          <input type="number" id="ctx-max-history" min="0" value="0">
        </div>
        <div class="form-group">
          <label for="ctx-temperature">Temperature</label>
          <input type="number" id="ctx-temperature" min="0" max="2" step="0.1" value="0.7">
        </div>
        <div class="form-group">
          <label for="ctx-top-p">Top P</label>
          <input type="number" id="ctx-top-p" min="0" max="1" step="0.1" value="1.0">
        </div>
        <div class="form-group">
          <label for="ctx-params">其他参数 (JSON)</label>
          <textarea id="ctx-params" rows="2" placeholder='{"thinking": {"budget_tokens": 1024}}'></textarea>
        </div>
        <div class="form-group">
          <label for="ctx-reasoning-effort">reasoning_effort</label>
          <input type="text" id="ctx-reasoning-effort" placeholder="low / medium / high">
        </div>
        <div class="form-actions">
           <button id="export-data-btn" class="secondary-btn">导出所有配置</button>
           <input type="file" id="import-file" style="display:none" accept=".json">
           <button id="import-data-btn" class="secondary-btn">导入配置</button>
        </div>
      </div>
      <div class="modal-footer">
        <button id="save-context-config-btn" class="primary-btn">保存</button>
      </div>
    </div>
  </div>

  <!-- Model Selection Modal -->
  <div id="model-selection-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>选择要添加的模型</h3>
        <button class="close-modal-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <input type="text" id="model-filter-input" placeholder="过滤模型...">
        </div>
        <div id="model-checkbox-list" class="checkbox-list">
           <!-- checkboxes -->
        </div>
      </div>
      <div class="modal-footer">
        <button id="confirm-model-selection-btn" class="primary-btn">添加选中模型</button>
      </div>
    </div>
  </div>

  <!-- Context Right Click Menu -->
  <div id="context-menu" class="context-menu hidden">
    <div class="menu-item" data-action="edit">编辑</div>
    <div class="menu-item" data-action="delete">删除</div>
  </div>

  <!-- Language Selection Modal -->
  <div id="language-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>选择语言 / Select Language / Seleccionar Idioma</h3>
        <button class="close-modal-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div id="language-options" class="language-options">
          <button class="language-option" data-lang="en">
            <span class="lang-flag">🇺🇸</span>
            <span class="lang-name">English</span>
          </button>
          <button class="language-option" data-lang="zh-CN">
            <span class="lang-flag">🇨🇳</span>
            <span class="lang-name">中文</span>
          </button>
          <button class="language-option" data-lang="es">
            <span class="lang-flag">🇪🇸</span>
            <span class="lang-name">Español</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Speech Config Modal -->
  <div id="speech-config-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="speech-config-title">语音输入设置</h3>
        <button class="close-modal-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label id="speech-lang-label">输入语言</label>
          <div id="speech-lang-options" class="speech-lang-options">
            <button class="speech-lang-option selected" data-lang="zh-CN">
              <span class="lang-flag">🇨🇳</span>
              <span class="lang-name">中文</span>
            </button>
            <button class="speech-lang-option" data-lang="en">
              <span class="lang-flag">🇺🇸</span>
              <span class="lang-name">English</span>
            </button>
            <button class="speech-lang-option" data-lang="es">
              <span class="lang-flag">🇪🇸</span>
              <span class="lang-name">Español</span>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label id="speech-sensitivity-label">灵敏度 (静默等待时间)</label>
          <div class="speech-slider-row">
            <span>快</span>
            <input type="range" id="speech-sensitivity" min="300" max="2000" step="100" value="600">
            <span>慢</span>
          </div>
          <div class="speech-slider-value" id="speech-sensitivity-value">600ms</div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="speech-start-btn" class="primary-btn">开始录音</button>
      </div>
    </div>
  </div>

  <script type="module" src="./dist/sidepanel.js"></script>
</body>
</html>
